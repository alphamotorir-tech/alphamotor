<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="description" content="جستجوی خدمات تراشکاری آلفا موتور تبریز">
<title>جستجو | آلفا موتور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.search-page-wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
.search-page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.search-page-title{margin:0;font-size:24px;color:var(--ink)}

.search-home-link{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  color:var(--steel);text-decoration:none;
  padding:9px 16px;border:1px solid var(--line);border-radius:10px;
  background:#fff;font-size:14px;font-weight:600;
  box-shadow:0 1px 4px rgba(44,42,36,.05);
  transition:background .2s ease,border-color .2s ease,color .2s ease;
}
.search-home-link:hover{background:var(--cream-2);border-color:var(--copper);color:var(--copper)}
.search-home-link svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.search-real-form{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px;
  border-radius:14px;background:#fff;border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(44,42,36,.07);box-sizing:border-box;
  transition:box-shadow .2s ease,border-color .2s ease;
}
.search-real-form:focus-within{border-color:var(--copper);box-shadow:0 2px 10px rgba(168,92,52,.18)}
.search-real-form input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:10px 12px;text-align:right}
.search-real-form input::placeholder{color:var(--ink-soft)}
.search-real-form button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;border:0;border-radius:9px;background:var(--cream-2);color:var(--steel);cursor:pointer;transition:background .2s ease}
.search-real-form button:hover{background:var(--line)}
.search-real-form svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#status{text-align:center;margin:18px 0;min-height:24px;color:var(--ink-soft)}
#results{display:grid;gap:26px}
.search-group{display:grid;gap:12px}
.search-group-title{display:flex;align-items:center;gap:10px;margin:0;padding-bottom:8px;font-size:18px;color:var(--ink);border-bottom:2px solid var(--copper)}
.search-group-count{font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--cream-2);border-radius:20px;padding:1px 10px}
.search-result-card{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 5px rgba(44,42,36,.05);transition:border-color .2s ease,box-shadow .2s ease}
.search-result-card:hover{border-color:var(--copper);box-shadow:0 2px 10px rgba(44,42,36,.08)}
.search-result-card strong{display:block;margin-bottom:7px;color:var(--ink)}
.search-result-card small{color:var(--ink-soft);line-height:1.9}
</style>
</head>
<body>
<main class="search-page-wrap">
  <div class="search-page-head">
    <h1 class="search-page-title">جستجوی خدمات</h1>
    <a class="search-home-link" href="/">
      <svg viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"></path></svg>
      بازگشت به سایت
    </a>
  </div>

  <form class="search-real-form" id="searchForm" autocomplete="off">
    <input id="searchInput" type="search" placeholder="جستجوی خدمات..." aria-label="جستجوی خدمات">
    <button type="submit" aria-label="جستجو">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l5 5"></path></svg>
    </button>
  </form>

  <div id="status"></div>
  <div id="results"></div>
</main>

<script>
const form=document.getElementById('searchForm');
const input=document.getElementById('searchInput');
const status=document.getElementById('status');
const resultsBox=document.getElementById('results');

const normalize=v=>(v||'').toString().toLocaleLowerCase('fa-IR')
.replace(/[يى]/g,'ی').replace(/[ك]/g,'ک').replace(/[ۀة]/g,'ه')
.replace(/[\u200c\u200d]/g,'').replace(/[ًٌٍَُِّْـ]/g,'')
.replace(/[٠-٩]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
.replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))
.replace(/[\s\u00a0]+/g,' ').trim();

const matches=(text,q)=>{
 const h=normalize(text),n=normalize(q);
 return n && (h.includes(n) || h.replace(/\s+/g,'').includes(n.replace(/\s+/g,'')) || n.split(/\s+/).every(w=>h.includes(w)));
};

let sections=[];
fetch('/').then(r=>r.text()).then(source=>{
 const doc=new DOMParser().parseFromString(source,'text/html');
 const selectors=['section','article','.card','.feature','.service','.service-card','.timeline-item','.process-item','.faq-item','footer .contact-item','.map-section'];
 const seen=new Set();
 selectors.forEach(sel=>doc.querySelectorAll(sel).forEach(el=>{
   const text=(el.textContent||'').replace(/\s+/g,' ').trim();
   if(!seen.has(el) && !el.closest('[data-nosearch]') && text.length>=8){
     seen.add(el);
     sections.push({
       text,
       title:(el.querySelector('h2,h3,h4')?.textContent||'بخش مرتبط').trim(),
       category:el.closest('[data-category]')?.dataset.category||'سایر بخش‌ها',
       href:el.querySelector('h3 a')?.getAttribute('href')||''
     });
   }
 }));
});

form.addEventListener('submit',e=>{
 e.preventDefault();
 const q=input.value.trim();
 if(!q){resultsBox.innerHTML='';status.textContent='';return;}
 const found=sections.filter(x=>matches(x.text,q));
 resultsBox.innerHTML='';
 status.textContent=found.length ? `${found.length} بخش مرتبط با «${q}» پیدا شد` : `هیچ بخشی برای «${q}» پیدا نشد`;
 const order=['خودرو','موتورسیکلت','سایر بخش‌ها'];
 order.forEach(cat=>{
   const list=found.filter(x=>x.category===cat);
   if(!list.length) return;
   const group=document.createElement('section');
   group.className='search-group';
   const h=document.createElement('h2');
   h.className='search-group-title';
   h.textContent=cat+' ';
   const count=document.createElement('span');
   count.className='search-group-count';
   count.textContent=list.length.toLocaleString('fa-IR');
   h.appendChild(count);
   group.appendChild(h);
   list.forEach(x=>{
     const card=document.createElement(x.href?'a':'div');
     if(x.href) card.href=x.href;
     card.className='search-result-card';
     card.innerHTML='<strong></strong><small></small>';
     card.querySelector('strong').textContent=x.title;
     card.querySelector('small').textContent=x.text.slice(0,240)+(x.text.length>240?'…':'');
     group.appendChild(card);
   });
   resultsBox.appendChild(group);
 });
 input.blur();
});
</script>
<script src="js/admin-link.js"></script>
</body>
</html>
