<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پنل مدیریت آلفا موتور</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#3E4A52">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream-1:#F8F4EA;--cream-2:#EFE7D6;--line:#D9CEB4;--ink:#2C2A24;--ink-soft:#6B6656;--steel:#3E4A52;--copper:#A85C34;--danger:#b3372f;--ok:#2f6b3a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--cream-1);color:var(--ink);line-height:1.8;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 20px}
.box h1{font-size:20px;margin-bottom:4px}
.muted{color:var(--ink-soft);font-size:13.5px}
.tabs{display:flex;gap:6px;margin:16px 0 14px;background:var(--cream-2);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;color:var(--ink-soft)}
.tabs button.on{background:#fff;color:var(--steel);box-shadow:0 1px 3px rgba(0,0,0,.08)}
label.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13.5px;color:var(--ink-soft)}
input[type=text],input[type=email],input[type=password],input[type=url],textarea,select{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(168,92,52,.35);border-color:var(--copper)}
textarea{resize:vertical;min-height:110px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--steel);color:#fff}
.btn.copper{background:var(--copper)}
.btn.ghost{background:transparent;color:var(--steel);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn.small{padding:7px 12px;font-size:13.5px}
.btn:disabled{opacity:.55;cursor:default}
.btn.block{width:100%}
.msg{margin-top:10px;font-size:13.5px;min-height:1.4em}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
/* shell */
.topbar{position:sticky;top:0;z-index:20;background:var(--steel);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.topbar h2{font-size:16px;font-weight:600;flex:1}
.burger{width:44px;height:44px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:10px}
.burger:active{background:rgba(255,255,255,.12)}
.burger i{display:block;width:22px;height:2.5px;background:#fff;border-radius:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(300px,82vw);background:#fff;z-index:40;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.15)}
.drawer.on{transform:translateX(0)}
.drawer-head{padding:18px 16px;background:var(--steel);color:#fff;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.drawer-head b{display:block;font-size:17px}
.drawer-head span{font-size:12.5px;opacity:.8;word-break:break-all}
.drawer nav{flex:1;overflow:auto;padding:8px}
.drawer nav button{display:block;width:100%;text-align:right;background:transparent;border:0;border-radius:10px;padding:13px 14px;font-size:15.5px;color:var(--ink)}
.drawer nav button.on{background:var(--cream-2);font-weight:700;color:var(--steel)}
.drawer nav hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
.drawer nav button.logout{color:var(--danger)}
main{max-width:720px;margin:0 auto;padding:16px 14px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{font-size:16px;margin-bottom:4px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.note{background:var(--cream-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-soft);margin-bottom:14px}
.spinner{padding:30px;text-align:center;color:var(--ink-soft)}
.rv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.rv-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rv-head b{font-size:15px}
.rv-stars{color:var(--copper);letter-spacing:2px;white-space:nowrap}
.rv small{color:var(--ink-soft);display:block;font-size:12.5px}
.rv p{margin-top:6px;overflow-wrap:anywhere;white-space:pre-wrap}
.grp{font-size:14px;color:var(--ink-soft);margin:18px 2px 8px;font-weight:700}
.svc{display:flex;gap:12px;align-items:center;width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.svc img{width:56px;height:56px;border-radius:9px;object-fit:cover;background:var(--cream-2);flex:none}
.svc b{font-size:14.5px;font-weight:600;display:block}
.svc .tag{display:inline-block;font-size:11.5px;background:var(--cream-2);color:var(--ink-soft);border-radius:6px;padding:0 7px;margin-top:2px}
.svc .tag.off{background:#f3d7d4;color:var(--danger)}
.preview{width:160px;height:160px;border-radius:12px;object-fit:cover;background:var(--cream-2);border:1px solid var(--line);display:block;margin-bottom:10px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0 14px;font-size:14.5px}
.chk input{width:20px;height:20px}
.user{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.user div{min-width:0}
.user b{word-break:break-all;font-size:14px;font-weight:600;display:block}
.user small{color:var(--ink-soft)}
.sitelink{color:#fff;text-decoration:none;font-size:13px;border:1px solid rgba(255,255,255,.4);border-radius:18px;padding:6px 12px;white-space:nowrap}
.drawer nav a{display:block;text-align:right;text-decoration:none;border-radius:10px;padding:13px 14px;font-size:15.5px;color:var(--ink)}
.drawer nav a:active,.drawer nav button:active{background:var(--cream-2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:right;width:100%}
.stat b{display:block;font-size:26px;color:var(--steel);line-height:1.3}
.stat span{font-size:13px;color:var(--ink-soft)}
.alert{background:#fff4e5;border:1px solid #f1d3a6;border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa a,.qa button{display:block;text-align:center;text-decoration:none;background:var(--cream-2);color:var(--steel);border:0;border-radius:10px;padding:12px 8px;font-weight:600;font-size:14px}
.user{flex-direction:column;align-items:stretch}
.user .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.user .tag{font-size:12px;border-radius:6px;padding:0 8px;background:var(--cream-2);color:var(--ink-soft);white-space:nowrap}
.user .tag.ok{background:#dcefdc;color:var(--ok)}.user .tag.off{background:#f3d7d4;color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script>
(function () {
  'use strict';
  var C = window.ALPHA_CONFIG || {};
  var app = document.getElementById('app');

  /* ---------- helpers ---------- */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    var a = attrs || {};
    Object.keys(a).forEach(function (k) {
      var v = a[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++) {
        var kid = kids[j];
        if (kid === null || kid === undefined || kid === false) continue;
        el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      }
    }
    return el;
  }
  function mount(node) { app.textContent = ''; app.append(node); }
  function toast(text) {
    var t = h('div', { class: 'toast' }, text);
    document.body.append(t);
    setTimeout(function () { t.remove(); }, 2600);
  }
  function fa(err) {
    var m = String((err && err.message) || err || '').toLowerCase();
    if (m.indexOf('invalid login') > -1) return 'ایمیل یا رمز عبور اشتباه است.';
    if (m.indexOf('already') > -1 && m.indexOf('regist') > -1) return 'این ایمیل قبلاً ثبت شده است.';
    if (m.indexOf('not confirmed') > -1) return 'ابتدا ایمیل خود را تأیید کنید.';
    if (m.indexOf('password') > -1 && (m.indexOf('least') > -1 || m.indexOf('weak') > -1 || m.indexOf('short') > -1)) return 'رمز عبور ضعیف یا کوتاه است (حداقل ۸ کاراکتر).';
    if (m.indexOf('rate limit') > -1 || m.indexOf('too many') > -1) return 'تعداد تلاش‌ها زیاد است؛ کمی بعد دوباره امتحان کنید.';
    if (m.indexOf('failed to fetch') > -1 || m.indexOf('network') > -1) return 'اتصال به سرور برقرار نشد.';
    if (m.indexOf('signups not allowed') > -1 || m.indexOf('signup is disabled') > -1) return 'ثبت‌نام غیرفعال شده است.';
    if (m.indexOf('permission') > -1 || m.indexOf('row-level') > -1 || m.indexOf('not allowed') > -1) return 'اجازه انجام این کار را ندارید.';
    return 'خطا: ' + ((err && err.message) || 'نامشخص');
  }
  function faDate(iso) {
    try { return new Date(iso).toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' }); }
    catch (e) { return ''; }
  }

  if (!C.SUPABASE_URL || !C.SUPABASE_KEY || !window.supabase) {
    mount(h('div', { class: 'center-wrap' }, h('div', { class: 'box' },
      h('h1', {}, 'پنل مدیریت'),
      h('p', { class: 'muted', style: 'margin-top:8px' },
        'اتصال به Supabase تنظیم نشده است. مقدارهای SUPABASE_URL و SUPABASE_KEY را در فایل js/config.js وارد کنید.'))));
    return;
  }

  var sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY);
  var currentUser = null;   // کاربر وارد شده (برای جلوگیری از رندر دوباره)
  var shellReady = false;

  /* ---------- auth screens ---------- */
  function setAdminFlag(on) {
    try {
      if (on) localStorage.setItem('alpha_admin_ui', '1');
      else localStorage.removeItem('alpha_admin_ui');
    } catch (e) { /* ignore */ }
  }

  function renderAuth() {
    shellReady = false;
    currentUser = null;
    setAdminFlag(false);
    var mode = 'login';
    var email = h('input', { type: 'email', autocomplete: 'email', required: true, dir: 'ltr', placeholder: 'name@example.com' });
    var pass = h('input', { type: 'password', autocomplete: 'current-password', required: true, minlength: 8, dir: 'ltr' });
    var msg = h('p', { class: 'msg' });
    var hint = h('p', { class: 'muted', style: 'margin-bottom:10px' });
    var submit = h('button', { class: 'btn copper block', type: 'submit' }, 'ورود');
    var tLogin = h('button', { type: 'button', class: 'on' }, 'ورود');
    var tReg = h('button', { type: 'button' }, 'ثبت‌نام');

    function setMode(m) {
      mode = m;
      tLogin.className = m === 'login' ? 'on' : '';
      tReg.className = m === 'register' ? 'on' : '';
      submit.textContent = m === 'login' ? 'ورود' : 'ساخت حساب';
      pass.setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
      msg.textContent = '';
      hint.textContent = m === 'register'
        ? 'اگر ایمیل شما از قبل به‌عنوان مدیر تعریف شده باشد، بعد از تأیید ایمیل مستقیماً وارد پنل می‌شوید؛ در غیر این صورت باید یکی از مدیران شما را تأیید کند.'
        : '';
    }
    tLogin.addEventListener('click', function () { setMode('login'); });
    tReg.addEventListener('click', function () { setMode('register'); });

    var form = h('form', {
      onsubmit: function (ev) {
        ev.preventDefault();
        msg.className = 'msg';
        msg.textContent = '';
        var em = email.value.trim();
        var pw = pass.value;
        if (!em || pw.length < 8) { msg.className = 'msg err'; msg.textContent = 'ایمیل و رمز عبور (حداقل ۸ کاراکتر) را وارد کنید.'; return; }
        submit.disabled = true;
        var p = mode === 'login'
          ? sb.auth.signInWithPassword({ email: em, password: pw })
          : sb.auth.signUp({ email: em, password: pw });
        p.then(function (res) {
          if (res.error) throw res.error;
          if (mode === 'register') {
            var u = res.data && res.data.user;
            if (u && u.identities && u.identities.length === 0) throw new Error('already registered');
            if (!res.data.session) {
              msg.className = 'msg ok';
              msg.textContent = 'ایمیل تأیید برای شما ارسال شد. پس از تأیید، وارد شوید.';
            }
          }
        }).catch(function (e) {
          msg.className = 'msg err';
          msg.textContent = fa(e);
        }).then(function () { submit.disabled = false; });
      }
    },
      h('label', { class: 'f' }, 'ایمیل', email),
      h('label', { class: 'f' }, 'رمز عبور', pass),
      hint, submit, msg);

    mount(h('div', { class: 'center-wrap' }, h('div', { class: 'box' },
      h('h1', {}, 'پنل مدیریت آلفا موتور'),
      h('p', { class: 'muted' }, 'ورود ویژه مدیران سایت'),
      h('div', { class: 'tabs' }, tLogin, tReg),
      form)));
  }

  function renderPending(user, rejected) {
    shellReady = false;
    setAdminFlag(false);
    mount(h('div', { class: 'center-wrap' }, h('div', { class: 'box' },
      h('h1', {}, rejected ? 'دسترسی رد شد' : 'در انتظار تأیید'),
      h('p', { class: 'muted', style: 'margin:8px 0 14px' },
        rejected
          ? 'درخواست دسترسی حساب ' + (user.email || '') + ' توسط مدیر سایت رد شده است.'
          : 'حساب ' + (user.email || '') + ' ساخته شده، ولی هنوز مدیر نیست. یکی از مدیران باید در بخش «مدیران» شما را تأیید کند. بعد از تأیید، صفحه را دوباره باز کنید.'),
      h('a', { class: 'btn ghost block', href: '../', style: 'display:block;text-align:center;text-decoration:none;margin-bottom:8px' }, 'بازگشت به سایت'),
      h('button', { class: 'btn ghost block', onclick: function () { sb.auth.signOut(); } }, 'خروج'))));
  }

  /* ---------- shell with hamburger menu ---------- */
  var SECTIONS = [
    { id: 'dashboard', title: 'داشبورد', render: renderDashboard },
    { id: 'badges', title: 'متن تضمین و سابقه', render: renderBadges },
    { id: 'hero', title: 'متن و زیرعنوان اول سایت', render: renderHero },
    { id: 'location', title: 'آدرس و موقعیت مکانی', render: renderLocation },
    { id: 'phones', title: 'شماره تماس‌ها', render: renderPhones },
    { id: 'reviews', title: 'نظرات مشتریان', render: renderReviews },
    { id: 'topics', title: 'موضوعات (خدمات)', render: renderTopics },
    { id: 'admins', title: 'مدیران', render: renderAdmins }
  ];

  function renderShell(user) {
    shellReady = true;
    var main = h('main');
    var title = h('h2', {}, '');
    var overlay = h('div', { class: 'overlay' });
    var drawer = h('div', { class: 'drawer', role: 'dialog', 'aria-label': 'منو' });
    var navBtns = {};

    function toggle(open) {
      drawer.classList.toggle('on', open);
      overlay.classList.toggle('on', open);
    }
    function go(id) {
      var s = SECTIONS.filter(function (x) { return x.id === id; })[0];
      Object.keys(navBtns).forEach(function (k) { navBtns[k].classList.toggle('on', k === id); });
      title.textContent = s.title;
      toggle(false);
      main.textContent = '';
      main.append(h('div', { class: 'spinner' }, 'در حال بارگذاری...'));
      Promise.resolve().then(function () { return s.render(main, user, go); }).then(function (node) {
        if (node) { main.textContent = ''; main.append(node); }
      }).catch(function (e) {
        main.textContent = '';
        main.append(h('div', { class: 'card' }, h('p', { class: 'msg err' }, fa(e))));
      });
      window.scrollTo(0, 0);
    }

    var nav = h('nav');
    SECTIONS.forEach(function (s) {
      var b = h('button', { type: 'button', onclick: function () { go(s.id); } }, s.title);
      navBtns[s.id] = b;
      nav.append(b);
    });
    nav.append(h('hr'), h('a', { href: '../' }, '← بازگشت به سایت'),
      h('button', { type: 'button', class: 'logout', onclick: function () { sb.auth.signOut(); } }, 'خروج'));

    drawer.append(h('div', { class: 'drawer-head' }, h('b', {}, 'پنل مدیریت'), h('span', { dir: 'ltr' }, user.email || '')), nav);
    overlay.addEventListener('click', function () { toggle(false); });

    var burger = h('button', { class: 'burger', type: 'button', 'aria-label': 'باز کردن منو', onclick: function () { toggle(true); } }, h('i'), h('i'), h('i'));
    mount(h('div', {}, h('header', { class: 'topbar' }, burger, title, h('a', { class: 'sitelink', href: '../' }, '← سایت')), main, overlay, drawer));
    go('dashboard');
  }

  /* ---------- generic settings editor ---------- */
  function settingsCard(fields, intro) {
    var keys = fields.map(function (f) { return f.key; });
    var wrap = h('div');
    if (intro) wrap.append(h('div', { class: 'note' }, intro));

    return sb.from('site_settings').select('key,value').in('key', keys).then(function (res) {
      if (res.error) throw res.error;
      var cur = {};
      (res.data || []).forEach(function (r) { cur[r.key] = r.value; });
      var inputs = {};
      var card = h('div', { class: 'card' });
      fields.forEach(function (f) {
        var inp = f.area
          ? h('textarea', { maxlength: f.max || 600, value: cur[f.key] || '' })
          : h('input', { type: 'text', maxlength: f.max || 120, value: cur[f.key] || '' });
        inputs[f.key] = inp;
        card.append(h('label', { class: 'f' }, f.label, inp));
      });
      var msg = h('p', { class: 'msg' });
      var save = h('button', { class: 'btn copper block', type: 'button' }, 'ذخیره تغییرات');
      save.addEventListener('click', function () {
        var rows = [];
        for (var i = 0; i < fields.length; i++) {
          var v = inputs[fields[i].key].value.trim();
          if (!v) { msg.className = 'msg err'; msg.textContent = 'فیلد «' + fields[i].label + '» خالی است.'; return; }
          rows.push({ key: fields[i].key, value: v, updated_at: new Date().toISOString() });
        }
        save.disabled = true;
        msg.className = 'msg';
        msg.textContent = '';
        sb.from('site_settings').upsert(rows, { onConflict: 'key' }).select().then(function (r) {
          if (r.error) throw r.error;
          if (!r.data || r.data.length !== rows.length) throw new Error('not allowed');
          msg.className = 'msg ok';
          msg.textContent = 'ذخیره شد. تغییرات همین الان روی سایت دیده می‌شود.';
          toast('ذخیره شد');
        }).catch(function (e) {
          msg.className = 'msg err';
          msg.textContent = fa(e);
        }).then(function () { save.disabled = false; });
      });
      card.append(save, msg);
      wrap.append(card);
      return wrap;
    });
  }

  /* ---------- dashboard ---------- */
  function fnum(n) { try { return Number(n).toLocaleString('fa-IR'); } catch (e) { return String(n); } }

  function renderDashboard(main, user, go) {
    return Promise.all([
      sb.from('reviews').select('id,name,rating,body,created_at', { count: 'exact' }).order('created_at', { ascending: false }).limit(3),

  /* ---------- آدرس و موقعیت مکانی ---------- */
  // مقدار پیش‌فرض همان چیزی است که داخل HTML سایت نوشته شده؛ تا وقتی چیزی ذخیره نشود، سایت همان را نشان می‌دهد.
  var LOC_DEFAULT = {
    address: 'تبریز، میلاد شهر، پشت مغازه‌های ملکوتی، کوچه آقاوندی، روبه‌روی غذاخوری ممتاز',
    lat: 38.115481,
    lng: 46.28534
  };

  /* LOC-PARSE-START */
  var COORD_RE = /^\(?\s*(-?\d{1,3}(?:\.\d+)?)\s*[,;\/\s]+\s*(-?\d{1,3}(?:\.\d+)?)\s*\)?$/;

  function normDigits(str) {
    return String(str)
      .replace(/[۰-۹]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); })
      .replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
      .replace(/٫/g, '.')
      .replace(/[،؛]/g, ',');
  }

  function pairFrom(a, b) {
    var lat = parseFloat(a), lng = parseFloat(b);
    if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return { lat: lat, lng: lng };
  }

  // ورودی می‌تواند مختصات («عرض, طول») یا لینک کامل نقشه (گوگل‌مپ، نشان، بلد) باشد.
  function parseLocation(input) {
    var t = normDigits(input).trim();
    if (!t) return { error: 'مختصات یا لینک نقشه را وارد کنید.' };
    var pair = null, m;

    if (/^https?:\/\//i.test(t)) {
      var u;
      try { u = new URL(t); } catch (e) { return { error: 'لینک معتبر نیست.' }; }
      var host = u.hostname.replace(/^www\./, '').toLowerCase();
      if (/^(maps\.app\.goo\.gl|goo\.gl|g\.co|nshn\.ir|bit\.ly|tinyurl\.com)$/.test(host)) {
        return { error: 'این یک لینک کوتاه است و از داخل صفحه قابل خواندن نیست. لینک را در مرورگر باز کنید و آدرس کامل صفحه (یا مختصات) را اینجا بگذارید.' };
      }
      var dec = t;
      try { dec = decodeURIComponent(t); } catch (e) { /* ignore */ }

      m = dec.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);          // نقطهٔ دقیق پین در گوگل‌مپ
      if (m) pair = pairFrom(m[1], m[2]);
      if (!pair) {
        ['q', 'll', 'query', 'destination', 'center', 'sll'].some(function (k) {
          var v = u.searchParams.get(k);
          var mm = v && normDigits(v).trim().match(COORD_RE);
          if (mm) pair = pairFrom(mm[1], mm[2]);
          return !!pair;
        });
      }
      if (!pair) {                                                          // بلد: latitude / longitude
        var la = u.searchParams.get('latitude') || u.searchParams.get('lat');
        var lo = u.searchParams.get('longitude') || u.searchParams.get('lng') || u.searchParams.get('lon');
        if (la && lo) pair = pairFrom(la, lo);
      }
      if (!pair) {                                                          // گوگل‌مپ: @lat,lng
        m = dec.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
        if (m) pair = pairFrom(m[1], m[2]);
      }
      if (!pair) {                                                          // نشان: #c38.08-46.29-17z
        m = dec.match(/#c(-?\d+(?:\.\d+)?)-(-?\d+(?:\.\d+)?)-/);
        if (m) pair = pairFrom(m[1], m[2]);
      }
      if (!pair) {                                                          // آخرین راه: اولین جفت عدد اعشاری
        m = dec.match(/(-?\d{1,3}\.\d{4,})\s*[,\s\/]\s*(-?\d{1,3}\.\d{4,})/);
        if (m) pair = pairFrom(m[1], m[2]);
      }
      if (!pair) return { error: 'در این لینک مختصات پیدا نشد. مختصات را مستقیم وارد کنید.' };
    } else {
      m = t.match(COORD_RE);
      if (!m) return { error: 'مختصات را به شکل «عرض, طول» بنویسید؛ مثل 38.115481, 46.28534' };
      pair = pairFrom(m[1], m[2]);
      if (!pair) return { error: 'مقدار مختصات معتبر نیست (عرض حداکثر ۹۰ و طول حداکثر ۱۸۰).' };
    }

    // برای ایران: عرض حدود ۲۵ تا ۴۰ و طول حدود ۴۴ تا ۶۴؛ اگر برعکس نوشته شده باشد هشدار می‌دهیم.
    if (pair.lat > 44 && pair.lat < 64 && pair.lng > 25 && pair.lng < 40) {
      return { error: 'به نظر می‌رسد عرض و طول جابه‌جا شده است؛ اول عرض جغرافیایی (مثلاً 38.11) و بعد طول (مثلاً 46.28) را بنویسید.' };
    }
    return { lat: Number(pair.lat.toFixed(7)), lng: Number(pair.lng.toFixed(7)) };
  }
  /* LOC-PARSE-END */

  function renderLocation() {
    var keys = ['address', 'map_lat', 'map_lng'];
    return sb.from('site_settings').select('key,value').in('key', keys).then(function (res) {
      if (res.error) throw res.error;
      var cur = {};
      (res.data || []).forEach(function (r) { cur[r.key] = r.value; });

      var lat0 = parseFloat(cur.map_lat), lng0 = parseFloat(cur.map_lng);
      if (!isFinite(lat0) || !isFinite(lng0)) { lat0 = LOC_DEFAULT.lat; lng0 = LOC_DEFAULT.lng; }
      var addr0 = (typeof cur.address === 'string' && cur.address.trim()) ? cur.address : LOC_DEFAULT.address;

      var addr = h('textarea', { maxlength: 200, rows: 3, value: addr0 });
      var loc = h('input', { type: 'text', dir: 'ltr', autocomplete: 'off', spellcheck: 'false', value: lat0 + ', ' + lng0, placeholder: '38.115481, 46.28534' });
      var info = h('p', { class: 'msg' });
      var frame = h('iframe', {
        title: 'پیش‌نمایش نقشه', loading: 'lazy', referrerpolicy: 'no-referrer-when-downgrade',
        style: 'width:100%;height:220px;border:1px solid var(--line);border-radius:12px;background:var(--cream-2);display:block'
      });
      var frameWrap = h('div', { style: 'margin:4px 0 14px' }, frame);
      var msg = h('p', { class: 'msg' });
      var save = h('button', { class: 'btn copper block', type: 'button' }, 'ذخیره تغییرات');

      function refresh() {
        var r = parseLocation(loc.value);
        if (r.error) {
          info.className = 'msg err';
          info.textContent = r.error;
          frameWrap.style.display = 'none';
          return null;
        }
        info.className = 'msg ok';
        info.textContent = '';
        info.append('مختصات شناسایی شد: ', h('bdi', { dir: 'ltr' }, r.lat + ', ' + r.lng));
        var src = 'https://www.google.com/maps?q=' + r.lat + ',' + r.lng + '&output=embed';
        if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
        frameWrap.style.display = 'block';
        return r;
      }
      var timer = null;
      loc.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(refresh, 450); });

      save.addEventListener('click', function () {
        msg.className = 'msg';
        msg.textContent = '';
        var a = addr.value.trim().replace(/\s+/g, ' ');
        if (a.length < 8) { msg.className = 'msg err'; msg.textContent = 'آدرس را کامل وارد کنید.'; return; }
        var r = refresh();
        if (!r) { msg.className = 'msg err'; msg.textContent = 'موقعیت مکانی معتبر نیست؛ پیام بالای نقشه را ببینید.'; return; }
        var now = new Date().toISOString();
        var rows = [
          { key: 'address', value: a, updated_at: now },
          { key: 'map_lat', value: String(r.lat), updated_at: now },
          { key: 'map_lng', value: String(r.lng), updated_at: now }
        ];
        save.disabled = true;
        sb.from('site_settings').upsert(rows, { onConflict: 'key' }).select().then(function (u) {
          if (u.error) throw u.error;
          if (!u.data || u.data.length !== rows.length) throw new Error('not allowed');
          addr.value = a;
          loc.value = r.lat + ', ' + r.lng;   // لینک به مختصات تبدیل و ذخیره می‌شود
          msg.className = 'msg ok';
          msg.textContent = 'ذخیره شد. آدرس و نقشه همین الان روی سایت دیده می‌شود.';
          toast('ذخیره شد');
        }).catch(function (e) {
          msg.className = 'msg err';
          msg.textContent = fa(e);
        }).then(function () { save.disabled = false; });
      });

      var wrap = h('div');
      wrap.append(h('div', { class: 'note' },
        'آدرس و نقشه در پاورقی همهٔ صفحه‌ها، دکمهٔ مسیریابی، نقشهٔ صفحه اول و پاسخ سؤال «آدرس» عوض می‌شود. ' +
        'اطلاعات سئوی داخل کد (JSON-LD و برچسب‌های جغرافیایی) با این پنل تغییر نمی‌کنند؛ بعد از جابه‌جایی واقعی، آن‌ها و پروفایل گوگل/نشان/بلد را هم به‌روز کنید.'));
      wrap.append(h('div', { class: 'card' },
        h('label', { class: 'f' }, 'آدرس (نمایش روی سایت)', addr),
        h('label', { class: 'f' }, 'موقعیت روی نقشه: مختصات یا لینک', loc),
        h('p', { class: 'muted', style: 'margin:-4px 0 8px' },
          'یکی از این دو را بنویسید: مختصات «عرض, طول» (در گوگل‌مپ نقطه را نگه دارید تا پین بیفتد و مختصات را کپی کنید)، یا لینک کامل گوگل‌مپ، نشان یا بلد. ' +
          'لینک‌های کوتاه (مثل maps.app.goo.gl) خوانده نمی‌شوند؛ لینک را در مرورگر باز کنید و آدرس کامل را بگذارید.'),
        info, frameWrap, save, msg));
      refresh();
      return wrap;
    });
  }

  /* ---------- شماره تماس‌ها ---------- */
  // مقدار پیش‌فرض همان چیزی است که داخل HTML سایت نوشته شده (js/phones.js هم همین‌ها را دارد).
  var PHONE_DEFAULT = [
    { name: 'مهدی آذری', number: '09142446456' },
    { name: 'بهرام گوزلی', number: '09306530399' }
  ];

  function phoneClean(v) {
    var t = String(v)
      .replace(/[۰-۹]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); })
      .replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
      .replace(/[\s\-().]/g, '');
    return /^\+?\d{8,15}$/.test(t) ? t : '';
  }

  function renderPhones() {
    var keys = [];
    PHONE_DEFAULT.forEach(function (d, i) { keys.push('phone' + (i + 1) + '_name', 'phone' + (i + 1) + '_number'); });
    return sb.from('site_settings').select('key,value').in('key', keys).then(function (res) {
      if (res.error) throw res.error;
      var cur = {};
      (res.data || []).forEach(function (r) { cur[r.key] = r.value; });

      var card = h('div', { class: 'card' });
      var fields = [];
      PHONE_DEFAULT.forEach(function (d, i) {
        var nm = (typeof cur['phone' + (i + 1) + '_name'] === 'string' && cur['phone' + (i + 1) + '_name'].trim()) || d.name;
        var no = (typeof cur['phone' + (i + 1) + '_number'] === 'string' && cur['phone' + (i + 1) + '_number'].trim()) || d.number;
        var inName = h('input', { type: 'text', maxlength: 40, value: nm, autocomplete: 'off' });
        var inNum = h('input', { type: 'text', dir: 'ltr', inputmode: 'tel', maxlength: 20, autocomplete: 'off', spellcheck: 'false', value: no, placeholder: '09123456789' });
        fields.push({ name: inName, number: inNum, label: 'شمارهٔ ' + (i + 1) });
        if (i > 0) card.append(h('hr', { style: 'border:0;border-top:1px solid var(--line);margin:14px 0' }));
        card.append(
          h('h3', { style: 'margin-bottom:8px' }, 'شمارهٔ ' + fnum(i + 1)),
          h('label', { class: 'f' }, 'عنوان (مثلاً نام شخص یا «دفتر مرکزی»)', inName),
          h('label', { class: 'f' }, 'شماره تماس', inNum));
      });

      var msg = h('p', { class: 'msg' });
      var save = h('button', { class: 'btn copper block', type: 'button' }, 'ذخیره تغییرات');
      save.addEventListener('click', function () {
        msg.className = 'msg';
        msg.textContent = '';
        var rows = [], seen = {}, now = new Date().toISOString();
        for (var i = 0; i < fields.length; i++) {
          var f = fields[i];
          var nm = f.name.value.trim().replace(/\s+/g, ' ');
          var no = phoneClean(f.number.value);
          if (nm.length < 2) { msg.className = 'msg err'; msg.textContent = 'عنوان ' + f.label + ' را وارد کنید (حداقل ۲ حرف).'; return; }
          if (!no) { msg.className = 'msg err'; msg.textContent = 'شمارهٔ ' + f.label + ' معتبر نیست. فقط عدد بنویسید (مثل 09123456789 یا +989123456789).'; return; }
          if (seen[no]) { msg.className = 'msg err'; msg.textContent = 'دو شماره نباید یکسان باشند.'; return; }
          seen[no] = true;
          rows.push({ key: 'phone' + (i + 1) + '_name', value: nm, updated_at: now });
          rows.push({ key: 'phone' + (i + 1) + '_number', value: no, updated_at: now });
        }
        save.disabled = true;
        sb.from('site_settings').upsert(rows, { onConflict: 'key' }).select().then(function (u) {
          if (u.error) throw u.error;
          if (!u.data || u.data.length !== rows.length) throw new Error('not allowed');
          fields.forEach(function (f, i) {
            f.name.value = rows[i * 2].value;
            f.number.value = rows[i * 2 + 1].value;
          });
          msg.className = 'msg ok';
          msg.textContent = 'ذخیره شد. شماره‌ها همین الان در همهٔ صفحه‌های سایت عوض می‌شوند.';
          toast('ذخیره شد');
        }).catch(function (e) {
          msg.className = 'msg err';
          msg.textContent = fa(e);
        }).then(function () { save.disabled = false; });
      });
      card.append(save, msg);

      var wrap = h('div');
      wrap.append(h('div', { class: 'note' },
        'عنوان و شمارهٔ هر مورد در همهٔ صفحه‌ها عوض می‌شود: دکمه‌های «تماس»، نوار تماس پایین صفحه، پاورقی، صفحهٔ خدمات و صفحهٔ همکاران و پاسخ سؤال‌های متداول. ' +
        'نام شخص در متن‌های دیگر سایت (مثل صفحهٔ معرفی) با این بخش تغییر نمی‌کند، فقط عنوان کنار شماره‌ها. ' +
        'اطلاعات سئوی داخل کد (JSON-LD) هم برای بازدیدکننده به‌روز می‌شود، ولی ربات‌های گوگل ممکن است نسخهٔ قدیمی را ببینند؛ بعد از تغییر واقعی شماره، پروفایل گوگل/نشان/بلد را هم به‌روز کنید.'));
      wrap.append(card);
      return wrap;
    });
  }

  /* ---------- reviews ---------- */
  function renderReviews(main) {
    return sb.from('reviews').select('id,name,service,rating,body,created_at').order('created_at', { ascending: false }).limit(300).then(function (res) {
      if (res.error) throw res.error;
      var rows = res.data || [];
      var wrap = h('div');
      var count = h('div', { class: 'note' }, rows.length + ' نظر ثبت شده. با حذف هر نظر، همان لحظه از سایت هم برداشته می‌شود.');
      wrap.append(count);
      if (!rows.length) { wrap.append(h('div', { class: 'card' }, 'هنوز نظری ثبت نشده است.')); return wrap; }

      rows.forEach(function (r) {
        var box = h('div', { class: 'rv' });
        var del = h('button', { class: 'btn danger small', type: 'button' }, 'حذف نظر');
        del.addEventListener('click', function () {
          if (!window.confirm('نظر «' + r.name + '» برای همیشه حذف شود؟')) return;
          del.disabled = true;
          sb.from('reviews').delete().eq('id', r.id).select().then(function (d) {
            if (d.error) throw d.error;
            if (!d.data || !d.data.length) throw new Error('not allowed');
            box.remove();
            rows = rows.filter(function (x) { return x.id !== r.id; });
            count.textContent = rows.length + ' نظر ثبت شده. با حذف هر نظر، همان لحظه از سایت هم برداشته می‌شود.';
            toast('نظر حذف شد');
          }).catch(function (e) { del.disabled = false; toast(fa(e)); });
        });
        box.append(
          h('div', { class: 'rv-head' },
            h('b', {}, r.name),
            r.rating ? h('span', { class: 'rv-stars' }, '★★★★★'.slice(0, r.rating) + '☆☆☆☆☆'.slice(0, 5 - r.rating)) : null),
          h('small', {}, [faDate(r.created_at), r.service ? ' • ' + r.service : ''].join('')),
          h('p', {}, r.body),
          h('div', { class: 'row-actions' }, del));
        wrap.append(box);
      });
      return wrap;
    });
  }

  /* ---------- topics (services) ---------- */
  function cloudinaryReady() { return !!(C.CLOUDINARY_CLOUD_NAME && C.CLOUDINARY_UPLOAD_PRESET); }

  function uploadImage(file) {
    var fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', C.CLOUDINARY_UPLOAD_PRESET);
    return fetch('https://api.cloudinary.com/v1_1/' + encodeURIComponent(C.CLOUDINARY_CLOUD_NAME) + '/image/upload', { method: 'POST', body: fd })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j.error && j.error.message) || 'upload failed'); return j; }); })
      .then(function (j) {
        // نسخهٔ بهینه: فرمت و کیفیت خودکار، حداکثر عرض ۸۰۰
        return String(j.secure_url).replace('/upload/', '/upload/f_auto,q_auto,w_800,c_limit/');
      });
  }

  var CAT = { car: 'خودرو', moto: 'موتورسیکلت' };

  function renderTopics(main) {
    return sb.from('services').select('*').order('sort_order', { ascending: true }).then(function (res) {
      if (res.error) throw res.error;
      var rows = res.data || [];
      var wrap = h('div');
      wrap.append(h('div', { class: 'note' }, 'روی هر مورد بزنید تا عنوان، توضیح، عکس و نمایش/عدم نمایش آن را ویرایش کنید.'));
      ['car', 'moto'].forEach(function (cat) {
        wrap.append(h('div', { class: 'grp' }, 'خدمات ' + CAT[cat]));
        rows.filter(function (r) { return r.category === cat; }).forEach(function (r) {
          wrap.append(h('button', { type: 'button', class: 'svc', onclick: function () { openEditor(r); } },
            h('img', { src: r.image_url || '', alt: '', loading: 'lazy' }),
            h('div', {}, h('b', {}, r.title), r.visible ? null : h('span', { class: 'tag off' }, 'مخفی'))));
        });
      });

      function openEditor(r) {
        var title = h('input', { type: 'text', maxlength: 120, value: r.title });
        var desc = h('textarea', { maxlength: 600, value: r.description });
        var url = h('input', { type: 'url', dir: 'ltr', value: r.image_url || '', placeholder: 'https://...' });
        var alt = h('input', { type: 'text', maxlength: 160, value: r.image_alt || '' });
        var vis = h('input', { type: 'checkbox', checked: r.visible });
        var prev = h('img', { class: 'preview', src: r.image_url || '', alt: '' });
        var msg = h('p', { class: 'msg' });
        var upMsg = h('p', { class: 'muted' });
        url.addEventListener('change', function () { prev.src = url.value.trim(); });

        var file = h('input', { type: 'file', accept: 'image/*', style: 'display:none' });
        var upBtn = h('button', { type: 'button', class: 'btn ghost small' }, 'آپلود عکس جدید');
        upBtn.addEventListener('click', function () {
          if (!cloudinaryReady()) { toast('Cloudinary هنوز در js/config.js تنظیم نشده'); return; }
          file.click();
        });
        file.addEventListener('change', function () {
          var f = file.files && file.files[0];
          if (!f) return;
          if (!/^image\//.test(f.type)) { upMsg.textContent = 'فقط فایل عکس مجاز است.'; return; }
          if (f.size > 8 * 1024 * 1024) { upMsg.textContent = 'حجم عکس بیشتر از ۸ مگابایت است.'; return; }
          upBtn.disabled = true;
          upMsg.textContent = 'در حال آپلود...';
          uploadImage(f).then(function (u) {
            url.value = u;
            prev.src = u;
            upMsg.textContent = 'آپلود شد. برای اعمال روی سایت «ذخیره» را بزنید.';
          }).catch(function (e) { upMsg.textContent = /preset/i.test(e.message) ? 'پریست Cloudinary پیدا نشد؛ نام و حالت Unsigned آن را بررسی کنید.' : 'آپلود انجام نشد: ' + e.message; })
            .then(function () { upBtn.disabled = false; file.value = ''; });
        });

        var save = h('button', { type: 'button', class: 'btn copper block' }, 'ذخیره');
        save.addEventListener('click', function () {
          var t = title.value.trim(), d = desc.value.trim();
          if (t.length < 2 || d.length < 2) { msg.className = 'msg err'; msg.textContent = 'عنوان و توضیح را کامل کنید.'; return; }
          var patch = { title: t, description: d, image_url: url.value.trim() || null, image_alt: alt.value.trim() || null, visible: vis.checked, updated_at: new Date().toISOString() };
          save.disabled = true;
          msg.className = 'msg';
          msg.textContent = '';
          sb.from('services').update(patch).eq('slug', r.slug).select().then(function (u) {
            if (u.error) throw u.error;
            if (!u.data || !u.data.length) throw new Error('not allowed');
            toast('ذخیره شد');
            main.textContent = '';
            renderTopics(main).then(function (n) { main.append(n); });
          }).catch(function (e) { msg.className = 'msg err'; msg.textContent = fa(e); save.disabled = false; });
        });

        main.textContent = '';
        main.append(
          h('button', { type: 'button', class: 'btn ghost small', style: 'margin-bottom:12px', onclick: function () {
            main.textContent = '';
            renderTopics(main).then(function (n) { main.append(n); });
          } }, '→ بازگشت به فهرست'),
          h('div', { class: 'card' },
            h('h3', {}, CAT[r.category] + ' • ' + r.slug),
            h('p', { class: 'muted', style: 'margin-bottom:12px' }, 'صفحهٔ کامل این خدمت (services/' + r.slug + '.html) همان فایل ثابت است؛ اینجا فقط کارت آن در سایت ویرایش می‌شود.'),
            h('label', { class: 'f' }, 'عنوان', title),
            h('label', { class: 'f' }, 'توضیح کوتاه', desc),
            prev,
            h('div', { class: 'row-actions', style: 'margin-bottom:10px' }, upBtn, file),
            upMsg,
            h('label', { class: 'f' }, 'آدرس عکس', url),
            h('label', { class: 'f' }, 'متن جایگزین عکس (alt، برای سئو)', alt),
            h('label', { class: 'chk' }, vis, 'نمایش در سایت'),
            save, msg));
        window.scrollTo(0, 0);
      }
      return wrap;
    });
  }

  /* ---------- admins ---------- */
  function renderAdmins(main, user) {
    return sb.rpc('list_users').then(function (res) {
      if (res.error) throw res.error;
      var wrap = h('div');
      wrap.append(h('div', { class: 'note' }, 'کسانی که در همین صفحه ثبت‌نام کرده‌اند اینجا دیده می‌شوند. فقط افرادی که تأیید کنید به پنل دسترسی دارند؛ درخواست‌های نامطلوب را رد کنید.'));

      function rank(u) { return u.is_admin ? 1 : (u.is_rejected ? 2 : 0); }
      var list = (res.data || []).slice().sort(function (a, b) { return rank(a) - rank(b); });

      function act(label, cls, question, fn) {
        var btn = h('button', { type: 'button', class: 'btn small ' + cls }, label);
        btn.addEventListener('click', function () {
          if (!window.confirm(question)) return;
          btn.disabled = true;
          fn().then(function (r) {
            if (r.error) throw r.error;
            toast('انجام شد');
            main.textContent = '';
            renderAdmins(main, user).then(function (n) { main.append(n); });
          }).catch(function (e) { btn.disabled = false; toast(fa(e)); });
        });
        return btn;
      }

      list.forEach(function (u) {
        var isMe = u.user_id === user.id;
        var actions = h('div', { class: 'row-actions' });
        if (!isMe) {
          if (!u.is_admin) {
            actions.append(act('تأیید به‌عنوان مدیر', 'copper', 'این کاربر مدیر شود؟', function () {
              return sb.rpc('set_admin', { target: u.user_id, make_admin: true });
            }));
          }
          if (!u.is_rejected) {
            actions.append(act(u.is_admin ? 'حذف دسترسی' : 'رد درخواست', 'danger',
              u.is_admin ? 'دسترسی این مدیر حذف شود؟' : 'درخواست این ایمیل رد شود؟', function () {
                return sb.rpc('reject_user', { target: u.user_id });
              }));
          }
        }
        var status = u.is_admin ? 'مدیر' : (u.is_rejected ? 'رد شده' : 'در انتظار تأیید');
        var tagCls = 'tag' + (u.is_admin ? ' ok' : (u.is_rejected ? ' off' : ''));
        wrap.append(h('div', { class: 'user' },
          h('div', { class: 'top' },
            h('div', {}, h('b', { dir: 'ltr' }, u.email || '—'), h('small', {}, (isMe ? 'شما • ' : '') + faDate(u.created_at))),
            h('span', { class: tagCls }, status)),
          actions.children.length ? actions : null));
      });
      return wrap;
    });
  }

  /* ---------- routing ---------- */
  function route(session) {
    if (!session) { renderAuth(); return; }
    if (shellReady && currentUser === session.user.id) return;
    currentUser = session.user.id;
    sb.rpc('my_access').then(function (r) {
      if (r.error) throw r.error;
      if (r.data === 'admin') { setAdminFlag(true); renderShell(session.user); }
      else renderPending(session.user, r.data === 'rejected');
    }).catch(function (e) {
      setAdminFlag(false);
      mount(h('div', { class: 'center-wrap' }, h('div', { class: 'box' },
        h('p', { class: 'msg err' }, fa(e)),
        h('button', { class: 'btn ghost block', onclick: function () { sb.auth.signOut(); } }, 'خروج'))));
    });
  }

  sb.auth.onAuthStateChange(function (event, session) {
    if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED' || event === 'PASSWORD_RECOVERY') return;
    setTimeout(function () { route(session); }, 0);
  });
})();
</script>
</body>
</html>
