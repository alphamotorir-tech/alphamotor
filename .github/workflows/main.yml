name: Extract ZIP to Root

on:
workflow_dispatch:

permissions:
contents: write

jobs:
extract:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract ZIP
    run: |
      mkdir -p temp
      unzip -o "*.zip" -d temp
      cp -a temp/alphamotor-main/. .
      rm -rf temp extracted

  - name: Commit changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -A
      git commit -m "Extract project files to root" || echo "No changes"
      git push
