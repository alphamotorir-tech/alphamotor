name: Extract and Replace Files

on:
workflow_dispatch:

permissions:
contents: write

jobs:
extract:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Move and Replace
    run: |
      cp -a extracted/alphamotor-main/. .
      rm -rf extracted

  - name: Commit Changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -A
      git commit -m "Replace existing files with extracted project" || exit 0
      git push
