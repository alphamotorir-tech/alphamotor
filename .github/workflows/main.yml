name: Extract ZIP

on:
workflow_dispatch:

jobs:
extract:
runs-on: ubuntu-latest
permissions:
contents: write

steps:
  - uses: actions/checkout@v4

  - name: Extract ZIP
    run: |
      mkdir -p temp
      unzip -o "*.zip" -d temp
      cp -a temp/alphamotor-main/. .
      rm -rf temp extracted

  - name: Save changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -A
      git commit -m "Extract ZIP into root" || exit 0
      git push
